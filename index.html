        <h1 style="color: #4f46e5;">Athencert — Modern Tech Certification Learning Platform</h1>
        <p>Master AWS, Azure, Google Cloud, Cisco CCNA, CompTIA, and Kubernetes certifications through 108 bite-sized curated lessons, spaced repetition flashcards, interactive scenario labs, and full timed mock exams.</p>
        
        <h2 style="color: #60a5fa; margin-top: 2rem;">Certification Programs:</h2>
        <ul>
          <li><a href="/certifications/aws/cloud-practitioner" style="color: #38bdf8; font-weight: bold;">AWS Certified Cloud Practitioner (CLF-C02)</a> — 20 Lessons covering Cloud Concepts, IAM Security, VPC, Compute, Storage, Databases, Well-Architected Framework, and AWS Support.</li>
          <li><a href="/certifications/azure/az-900" style="color: #38bdf8; font-weight: bold;">Microsoft Azure Fundamentals (AZ-900)</a> — 20 Lessons covering Azure Regions, VMs, Blob Tiers, Entra ID, Azure Monitor, Policy, Defender for Cloud, and SLAs.</li>
          <li><a href="/certifications/google/cloud-fundamentals" style="color: #38bdf8; font-weight: bold;">Google Cloud Digital Leader (CDL)</a> — 20 Lessons covering Resource Hierarchy, Compute Engine, Cloud Run, GKE, BigQuery, Pub/Sub, Vertex AI, and Security Command Center.</li>
          <li><a href="/certifications/kubernetes/fundamentals" style="color: #38bdf8; font-weight: bold;">Kubernetes Fundamentals & CKA/CKAD</a> — 16 Lessons covering Control Plane architecture, Pods, StatefulSets, Services, Ingress, NetworkPolicies, Helm, and Cluster Diagnostics.</li>
          <li><a href="/certifications/cisco/networking" style="color: #38bdf8; font-weight: bold;">Cisco Certified Network Associate (CCNA 200-301)</a> — 16 Lessons covering OSI 7 layers, IPv4/IPv6 VLSM subnetting, VLANs, OSPF routing, Switch Security, Wireless WLC, and SDN Automation.</li>
          <li><a href="/certifications/comptia/fundamentals" style="color: #38bdf8; font-weight: bold;">CompTIA IT Fundamentals (ITF+) & A+</a> — 16 Lessons covering Hardware Architecture, Storage RAID, CLI Administration, Wi-Fi 6, Cybersecurity MFA, SQL, and 6-step Troubleshooting.</li>
        </ul>
